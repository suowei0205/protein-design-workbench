name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip 'setuptools>=83,<84'
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_publication.py
      - run: ruff check src tests scripts
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
      - run: python -m pip check
      - run: bandit -r src/pwb -ll -ii -f json -o bandit-report.json
      - run: pip-audit --skip-editable --progress-spinner off
  browser:
    name: Offline UI / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pwb-ci-browsers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: node tests/ui_selfcheck.js
      - run: node tests/ui_forms_selfcheck.js
      - run: node tests/ui_offline_selfcheck.js
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Allow the exact test Chromium binary to create its sandbox
        run: |
          browser_executable=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome-headless-shell)
          test -x "$browser_executable"
          test "$(printf '%s\n' "$browser_executable" | wc -l)" -eq 1
          # Path-scoped userns permission, following Chromium's AppArmor guide.
          # Chromium's sandbox remains enabled; global restrictions stay enabled.
          sudo tee /etc/apparmor.d/pwb-ci-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile pwb-ci-chromium "$browser_executable" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/pwb-ci-chromium
      - run: node tests/ui_sidebar_browser.js
        env:
          PWB_ASSETS_DIR: src/pwb/assets
          PWB_QA_DIR: test-results/sidebar
