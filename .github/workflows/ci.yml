name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_publication.py
      - run: ruff check src tests scripts
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
      - run: python -m pip check
      - run: bandit -r src/pwb -ll -ii -f json -o bandit-report.json
      - run: pip-audit --skip-editable --progress-spinner off
  browser:
    name: Offline UI / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node tests/ui_selfcheck.js
      - run: node tests/ui_forms_selfcheck.js
      - run: node tests/ui_offline_selfcheck.js
      - run: npm install --no-save --ignore-scripts --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui_sidebar_browser.js
        env:
          PWB_ASSETS_DIR: src/pwb/assets
          PWB_QA_DIR: test-results/sidebar
